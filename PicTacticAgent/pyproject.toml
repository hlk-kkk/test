[project]
name = "pictactic"
version = "0.1.0"
description = "AI-driven cover image generation tool with multi-agent collaboration"
authors = [{ name = "PicTacticAgent Team" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",
    "langchain>=1.0.0",
    "langchain-openai>=1.0.0",
    "openai>=1.0.0",
    "langgraph>=1.0.0",
    "langgraph-checkpoint>=2.0.0",
    "httpx>=0.28.0",
    "aiofiles>=24.1.0",
    "pillow>=11.0.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",
    "google-genai>=1.0.0",
    "langchain-google-genai>=2.0.0",
    "bcrypt>=4.2.0",
    "pyjwt>=2.9.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "gemini-webapi>=2.0.0",
]

[project.scripts]
pictactic = "pictactic.cli.main:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "websockets>=12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/pictactic"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "websockets>=12.0",
]

[tool.uv.sources]
# 可在此配置私有源或镜像源
