# Rate limiting zones
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=generation:10m rate=10r/m;

# Map: only apply generation rate-limit to write methods (POST/PUT/DELETE)
map $request_method $generation_limit {
    default         "";
    POST            $binary_remote_addr;
    PUT             $binary_remote_addr;
    DELETE          $binary_remote_addr;
}
limit_req_zone $generation_limit zone=generation_writes:10m rate=10r/m;

# Backend upstream — override BACKEND_HOST via env if using host network mode
# Default: "backend" (Docker service discovery)
# Host mode: set BACKEND_HOST=host.docker.internal in docker-compose.override.yml
upstream pictactic_backend {
    server ${BACKEND_HOST}:8019;
}

server {
    listen 80;
    server_name _;

    server_tokens off;
    client_max_body_size 50M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Auth rate limiting
    location /api/v1/auth/login {
        limit_req zone=auth burst=3 nodelay;
        proxy_pass http://pictactic_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/auth/register {
        limit_req zone=auth burst=3 nodelay;
        proxy_pass http://pictactic_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Generation endpoints — rate-limit writes (POST/DELETE) only;
    # GET requests (status polling, history) are unlimited.
    location /api/v1/generation/ {
        limit_req zone=generation_writes burst=5 nodelay;
        proxy_pass http://pictactic_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        proxy_send_timeout 120;
    }

    location /api/v1/video/ {
        limit_req zone=generation_writes burst=5 nodelay;
        proxy_pass http://pictactic_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        proxy_send_timeout 120;
    }

    # API proxy (general, after specific rate-limited locations)
    location /api/ {
        proxy_pass http://pictactic_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket proxy
    location /ws/ {
        proxy_pass http://pictactic_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Health check proxy
    location = /health {
        proxy_pass http://pictactic_backend;
    }

    # Static images from volume
    location /static/images/ {
        alias /app/storage/images/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Static videos from volume
    location /static/videos/ {
        alias /app/storage/videos/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # SPA fallback — must be last
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
