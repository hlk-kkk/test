<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CookieBridge</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="header-left">
        <img src="icons/icon48.png" alt="CookieBridge" class="logo">
        <div class="header-text">
          <h1>MediaCrawlerPro-CookieBridge</h1>
          <div class="version">v2.0 Multi-Account</div>
        </div>
      </div>
      <div class="status-badge" id="statusBadge">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">--</span>
      </div>
    </div>

    <!-- Client Info -->
    <div class="client-info">
      <svg class="info-icon" viewBox="0 0 16 16" fill="none"><path d="M8 1a7 7 0 100 14A7 7 0 008 1zm0 2.8a1.05 1.05 0 110 2.1 1.05 1.05 0 010-2.1zM6.5 7h1.75v4.2H10v1.05H6.5V11.2h1.75V8.05H6.5V7z" fill="currentColor"/></svg>
      <span class="client-id-label">Client ID</span>
      <span class="client-id-value" id="clientId" title="">--</span>
    </div>

    <!-- Platform List -->
    <div class="section-title">
      <svg class="section-icon" viewBox="0 0 16 16" fill="none"><path d="M2 3.5A1.5 1.5 0 013.5 2h9A1.5 1.5 0 0114 3.5v9a1.5 1.5 0 01-1.5 1.5h-9A1.5 1.5 0 012 12.5v-9zM3.5 3a.5.5 0 00-.5.5v9a.5.5 0 00.5.5h9a.5.5 0 00.5-.5v-9a.5.5 0 00-.5-.5h-9z" fill="currentColor"/><path d="M5 5.5a.5.5 0 01.5-.5h5a.5.5 0 010 1h-5a.5.5 0 01-.5-.5zm0 2.5a.5.5 0 01.5-.5h5a.5.5 0 010 1h-5A.5.5 0 015 8zm0 2.5a.5.5 0 01.5-.5h3a.5.5 0 010 1h-3a.5.5 0 01-.5-.5z" fill="currentColor"/></svg>
      Platforms
    </div>
    <div class="platform-list" id="platformList"></div>

    <!-- Sync Button -->
    <button id="syncBtn" class="sync-btn">
      <svg class="btn-icon" viewBox="0 0 16 16" fill="none"><path d="M11.534 7h3.932a.25.25 0 01.192.41l-1.966 2.36a.25.25 0 01-.384 0l-1.966-2.36A.25.25 0 0111.534 7zm-7.068 2H.534a.25.25 0 01-.192-.41L2.308 6.23a.25.25 0 01.384 0l1.966 2.36A.25.25 0 014.466 9z" fill="currentColor"/><path d="M8 3a5 5 0 00-4.546 2.914.5.5 0 01-.908-.418A6 6 0 0114 8a.5.5 0 01-1 0 5 5 0 00-5-5zm-6.5 5a.5.5 0 01.5.5A5 5 0 0012.546 11.086a.5.5 0 11.908.418A6 6 0 012 8a.5.5 0 01.5-.5z" fill="currentColor"/></svg>
      <span id="syncBtnText">Sync All</span>
    </button>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- Footer -->
    <div class="footer">
      <span class="server-url">ws://localhost:8274</span>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
